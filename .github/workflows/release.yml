name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  # Superseded branch-dispatch runs may be cancelled; a tag release and
  # anything on the default branch always runs to completion.
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test and validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Prebuilt static FFmpeg (ffmpeg + ffprobe, SHA-256 pinned), ~5s,
      # instead of brew installing a dependency tree (~20s). The media
      # tests exec `ffmpeg`/`ffprobe` from PATH and skip without them.
      - name: Install prebuilt FFmpeg for media tests
        run: |
          curl -sSfL --retry 3 -o ffmpeg.tar.gz \
            "https://github.com/vanloctech/ffmpeg-macos/releases/download/ffmpeg-2026.06.11/ffmpeg-macos-arm64.tar.gz"
          echo "26f5133f88d5ab1254cc03499acef42dae2dbc574dd26e0dade8c968420127e9  ffmpeg.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin" ffmpeg-bin
          tar xzf ffmpeg.tar.gz -C ffmpeg-bin
          sudo mv ffmpeg-bin/ffmpeg ffmpeg-bin/ffprobe "$RUNNER_TEMP/bin/"
          chmod +x "$RUNNER_TEMP/bin/ffmpeg" "$RUNNER_TEMP/bin/ffprobe"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check the release version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - run: go test ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin/universal
            directory: darwin-universal
            os: macos-latest
            kind: macos
          - platform: windows/amd64
            directory: windows-amd64
            os: windows-latest
            kind: windows
          - platform: windows/arm64
            directory: windows-arm64
            os: windows-latest
            kind: windows
          - platform: linux/amd64
            directory: linux-amd64
            os: ubuntu-latest
            kind: linux
          - platform: linux/arm64
            directory: linux-arm64
            os: ubuntu-latest
            kind: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # No choco install nsis: on Windows, mygo build downloads its own
      # SHA-256-pinned NSIS 3.13 into the user cache when makensis is
      # missing (a 2.3 MB zip, ~2s), which beats a choco dependency walk.
      # Build the pinned mygo CLI once into the setup-go caches (module +
      # build), then invoke the binary: go run would re-resolve and relink
      # it in every build job.
      - name: Build application packages
        run: |
          go install "github.com/egoist/mygo/cmd/mygo@$(go list -m -f '{{.Version}}' github.com/egoist/mygo)"
          "$(go env GOPATH)/bin/mygo" build -platform "${{ matrix.platform }}" -sign -
      - name: Check macOS bundle and signature
        if: matrix.kind == 'macos'
        run: |
          app="dist/${{ matrix.directory }}/Lumiwerk.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          test -n "$(find dist/${{ matrix.directory }} -maxdepth 1 -name '*.dmg' -type f -print -quit)"
      - name: Check Windows installer
        if: matrix.kind == 'windows'
        run: |
          installer="$(find "dist/${{ matrix.directory }}" -maxdepth 1 -name '*-setup-*.exe' -type f -print -quit)"
          test -n "$installer"
          test -s "$installer"
      - name: Check Linux packages
        if: matrix.kind == 'linux'
        run: |
          test -n "$(find "dist/${{ matrix.directory }}" -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$(find "dist/${{ matrix.directory }}" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.directory }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/darwin-universal/*.dmg
            dist/windows-*/*-setup-*.exe
            dist/linux-*/*.deb
            dist/linux-*/*.tar.gz
            dist/linux-amd64/install.sh

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-downloads
          merge-multiple: true
      - name: Collect and verify release assets
        run: |
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            target="release-assets/$(basename "$asset")"
            if [ -e "$target" ]; then
              echo "Duplicate release asset: $(basename "$asset")" >&2
              exit 1
            fi
            mv "$asset" "$target"
          done < <(find release-downloads -type f -print0)

          patterns=(
            'lumiwerk-*.dmg'
            'lumiwerk-setup-*-amd64.exe'
            'lumiwerk-setup-*-arm64.exe'
            'lumiwerk_*_amd64.deb'
            'lumiwerk_*_arm64.deb'
            'lumiwerk-*-linux-amd64.tar.gz'
            'lumiwerk-*-linux-arm64.tar.gz'
            'install.sh'
          )
          for pattern in "${patterns[@]}"; do
            mapfile -d '' matches < <(find release-assets -maxdepth 1 -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one asset matching $pattern, found ${#matches[@]}" >&2
              exit 1
            fi
            test -s "${matches[0]}"
          done
          (cd release-assets && sha256sum -- * > SHA256SUMS)
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "Lumiwerk $GITHUB_REF_NAME" --generate-notes
          fi
