name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the draft release that `mygo build -upload` fills

concurrency:
  group: desktop-release-${{ github.ref }}
  # Superseded branch-dispatch runs may be cancelled; a tag release and
  # anything on the default branch always runs to completion.
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test and validate
    runs-on: macos-latest
    env:
      # Keep the Go caches inside the workspace so a single cache
      # definition works on every OS.
      GOCACHE: ${{ github.workspace }}/.gocache
      GOPATH: ${{ github.workspace }}/.gopath
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the Go toolchain version
        id: goversion
        run: echo "version=$(awk '$1=="go" {print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      # Installing Go costs ~15s on macOS and ~40s on Windows. Caching the
      # exact hostedtoolcache directory (setup-go drops a .complete marker
      # inside it) makes setup-go skip the download and extraction.
      # Windows only: the image provisioner puts Go in the tool cache as a
      # junction, which the cache save cannot archive usefully (it saved
      # 205 bytes of link) and restoring it breaks setup-go with EEXIST.
      # Windows re-downloads Go instead (~26s).
      - name: Restore Go toolchain
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.goversion.outputs.version }}/${{ runner.arch == 'X64' && 'x64' || 'arm64' }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.goversion.outputs.version }}-v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # setup-go's built-in build cache keys on runner OS + go.sum, so the
      # two matrix jobs of one OS raced for a single key and the loser
      # recompiled everything on every run (windows/arm64: ~60s vs ~15s).
      # Key per job instead; "go-build-test" is shared with pr.yml.
      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: |
            .gocache
            .gopath
          key: go-build-test-v1-${{ hashFiles('go.sum') }}
          restore-keys: go-build-test-v1-
      # Pinned prebuilt FFmpeg (ffmpeg + ffprobe, evermeet.cx 9.0.2,
      # SHA-256 checked) instead of brew installing a dependency tree
      # (~20s). The extracted binaries are cached, so the slow first
      # download from a small host happens once. The media tests exec
      # `ffmpeg`/`ffprobe` from PATH and skip without them; these builds
      # decode PNG and encode MJPEG, which is what those tests need (a
      # brew build was verified equivalent).
      - name: Restore prebuilt FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: bin
          key: ffmpeg-evermeet-9.0.2-macos
      - name: Install prebuilt FFmpeg for media tests
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 3 -o ffmpeg.zip "https://evermeet.cx/ffmpeg/ffmpeg-9.0.2.zip"
          curl -sSfL --retry 3 -o ffprobe.zip "https://evermeet.cx/ffmpeg/ffprobe-9.0.2.zip"
          shasum -a 256 -c - <<'SUMS'
          4acc0be580f9b2788029eb7bd4d645ff87968911b0a62aeeb3940d42d54558d5  ffmpeg.zip
          24a9c968cd4da72d99c7245e914b921815835eb6dff01d99868031aebaf1d439  ffprobe.zip
          SUMS
          unzip -q ffmpeg.zip
          unzip -q ffprobe.zip
          mkdir bin
          mv ffmpeg ffprobe bin/
      - name: Add FFmpeg to PATH
        run: echo "$(pwd)/bin" >> "$GITHUB_PATH"
      - name: Check the release version
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # -count=1 like the local gate: a cached "ok" would not re-execute
      # the tests, and could mask a broken environment (e.g. a
      # missing ffmpeg makes the media tests skip silently).
      # The default build excludes gen2brain/go-mpv (its package init
      # panics without a system libmpv, which no CI runner has); release
      # builds add -tags mpvbackend and bundle the library.
      - run: go test -count=1 ./...
      - run: go vet ./...

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      # Per-target Go caches: see the test job for why these live in the
      # workspace and why the cache keys include the matrix platform.
      GOCACHE: ${{ github.workspace }}/.gocache
      GOPATH: ${{ github.workspace }}/.gopath
      # -upload signs each platform's update archive with this key and
      # uploads installers, update archives, deltas and manifests (last) to
      # the draft release of mygo.json's version. Publishing the draft makes
      # installed apps see the update; the publish job does that once every
      # platform is there.
      GH_TOKEN: ${{ github.token }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin/universal
            directory: darwin-universal
            os: macos-latest
            kind: macos
          - platform: windows/amd64
            directory: windows-amd64
            os: windows-latest
            kind: windows
          - platform: windows/arm64
            directory: windows-arm64
            os: windows-latest
            kind: windows
          - platform: linux/amd64
            directory: linux-amd64
            os: ubuntu-latest
            kind: linux
          - platform: linux/arm64
            directory: linux-arm64
            os: ubuntu-latest
            kind: linux
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the Go toolchain version
        id: goversion
        shell: bash
        run: echo "version=$(awk '$1=="go" {print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      # Windows only: the image provisioner puts Go in the tool cache as a
      # junction, which the cache save cannot archive usefully (it saved
      # 205 bytes of link) and restoring it breaks setup-go with EEXIST.
      # Windows re-downloads Go instead (~26s).
      - name: Restore Go toolchain
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/go/${{ steps.goversion.outputs.version }}/${{ runner.arch == 'X64' && 'x64' || 'arm64' }}
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.goversion.outputs.version }}-v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go build cache
        uses: actions/cache@v4
        with:
          path: |
            .gocache
            .gopath
          key: go-build-${{ matrix.platform }}-v1-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ matrix.platform }}-v1-
      # No choco install nsis: on Windows, mygo build downloads its own
      # SHA-256-pinned NSIS 3.13 into the user cache when makensis is
      # missing (a 2.3 MB zip, ~2s), which beats a choco dependency walk.
      # Build the pinned mygo CLI once into the setup-go caches (module +
      # build), then invoke the binary: go run would re-resolve and relink
      # it in every build job. -sign - keeps macOS ad-hoc (no Developer ID
      # on this repository yet); updates need only the Ed25519 update key.
      # Windows: libmpv is not in the repository (only the macOS dylibs
      # are), so fetch shinchiro's self-contained libmpv-2.dll into
      # resources/<platform>; mygo ships it next to Lumiwerk.exe, where the
      # loader looks first.
      - name: Fetch libmpv for Windows
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          set -eu
          arch=x86_64; [ "${{ matrix.directory }}" = windows-arm64 ] && arch=aarch64
          gh release download -R shinchiro/mpv-winbuild-cmake -p "mpv-dev-${arch}-2*.7z" -O mpv-dev.7z
          mkdir -p "resources/${{ matrix.directory }}"
          7z e -y mpv-dev.7z libmpv-2.dll -o"resources/${{ matrix.directory }}"
          rm mpv-dev.7z
          test -s "resources/${{ matrix.directory }}/libmpv-2.dll"
      - name: Build and upload to the draft release
        # GOFLAGS passes mpvbackend through mygo's productionTags into the
        # app build: the release bundles libmpv, so compile the real mpv
        # backend in (the test job's default build excludes it).
        env:
          GOFLAGS: -tags=mpvbackend
        run: |
          go install "github.com/egoist/mygo/cmd/mygo@$(go list -m -f '{{.Version}}' github.com/egoist/mygo)"
          "$(go env GOPATH)/bin/mygo" build -platform "${{ matrix.platform }}" -sign - -upload
      - name: Check macOS bundle and signature
        if: matrix.kind == 'macos'
        run: |
          app="dist/${{ matrix.directory }}/Lumiwerk.app"
          test -d "$app"
          codesign --verify --deep --strict "$app"
          test -n "$(find dist/${{ matrix.directory }} -maxdepth 1 -name '*.dmg' -type f -print -quit)"
      - name: Check Windows installer
        if: matrix.kind == 'windows'
        run: |
          installer="$(find "dist/${{ matrix.directory }}" -maxdepth 1 -name '*-setup-*.exe' -type f -print -quit)"
          test -n "$installer"
          test -s "$installer"
          for a in dist/${{ matrix.directory }}/*-${{ matrix.directory }}.tar.gz; do
            if [ -e "$a" ]; then tar tzf "$a" | grep -q libmpv-2.dll; fi
          done
      - name: Check Linux packages
        if: matrix.kind == 'linux'
        run: |
          test -n "$(find "dist/${{ matrix.directory }}" -maxdepth 1 -name '*.deb' -type f -print -quit)"
          test -n "$(find "dist/${{ matrix.directory }}" -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
      - name: Check the update files
        if: github.ref_type == 'tag'
        run: |
          version="$(jq -r .version mygo.json)"
          target="${{ matrix.directory }}"
          test -s "dist/${target}/lumiwerk-${version}-${target}.tar.gz"
          test -s "dist/${target}/update-${target}.json"

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The build jobs uploaded installers and update archives/manifests.
      # Strip install scripts / deltas, verify the kept set, then publish.
      - name: Verify and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(jq -r .version mygo.json)"
          tag="$GITHUB_REF_NAME"
          draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$draft" != "true" ]; then
            echo "::error::$tag is published already; bump the version in mygo.json to release again" >&2
            exit 1
          fi
          # Drop install scripts, deltas and other clutter mygo -upload may
          # still attach; keep only the installers users actually download
          # plus updater manifests and SHA256SUMS.
          names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            case "$name" in
              install.sh|install.ps1|*.delta|*.blockmap|latest*.yml)
                echo "removing $name"
                gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" --yes
                ;;
            esac
          done <<< "$names"
          names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          # darwin-universal covers both Apple Silicon and Intel.
          want="SHA256SUMS lumiwerk-$version.dmg"
          for p in darwin-universal windows-amd64 windows-arm64 linux-amd64 linux-arm64; do
            a="lumiwerk-$version-$p.tar.gz"
            want="$want $a update-$p.json"
            case "$p" in
              windows-*) want="$want lumiwerk-setup-$version-${p#windows-}.exe" ;;
              linux-amd64) want="$want lumiwerk_${version}_amd64.deb" ;;
              linux-arm64) want="$want lumiwerk_${version}_arm64.deb" ;;
            esac
          done
          missing=0
          for w in $want; do
            echo "$names" | grep -qxF "$w" || { echo "::error::$tag has no $w" >&2; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --title "Lumiwerk $tag"

  # 发布完成后，把 tvv.tw 加速链接写进发布说明（国内网络可直接下载）
  tvv-accelerate:
    name: 发布页追加 tvv.tw 加速链接
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 在发布说明末尾追加国内加速下载链接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="$(gh release list --repo "$repo" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName' || true)"
          if [ -z "$tag" ]; then echo "没有已发布的 release，跳过"; exit 0; fi
          if ! gh api "repos/$repo/releases/tags/$tag" > /dev/null 2>&1; then echo "$tag 对应的 release 不存在，跳过"; exit 0; fi
          if [ "$(gh api "repos/$repo/releases/tags/$tag" --jq .draft)" = "true" ]; then echo "$tag 还是草稿，跳过"; exit 0; fi
          assets="$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].url' || true)"
          if [ -z "$assets" ]; then echo "$tag 没有资产，跳过"; exit 0; fi
          block="$RUNNER_TEMP/tvv-block.md"
          {
            echo '## 国内加速下载'
            echo
            echo '以下链接走 tvv.tw 加速，国内网络可直接下载：'
            echo
            n=0
            while IFS= read -r url; do
              if [ -z "$url" ]; then continue; fi
              name="${url##*/}"
              case "$name" in
                update-*|*.delta|*.blockmap|*.json|latest*.yml|install.sh|install.ps1) continue ;;
              esac
              echo "- [${name}](https://tvv.tw/${url})"
              n=$((n+1))
            done <<< "$assets"
            if [ "$n" -eq 0 ]; then echo '（本次发布没有可列的安装包）'; fi
          } > "$block"
          notes="$RUNNER_TEMP/tvv-notes.md"
          gh release view "$tag" --repo "$repo" --json body --jq '.body // ""' \
            | sed '/^## 国内加速下载/,$d' > "$notes"
          cat "$block" >> "$notes"
          gh release edit "$tag" --repo "$repo" --notes-file "$notes"
          echo "已写入 $tag 的加速链接"
