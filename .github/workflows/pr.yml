name: PR Checks

# Every push to an open pull request runs the full test suite. Superseded
# runs of the same branch are cancelled, so the latest push decides.
# Docs-only changes change nothing the checks observe, so they skip CI
# entirely; the release workflow keeps running on every tag and every push
# to the default branch, and this workflow cannot gate a merge there.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and vet
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pinned prebuilt FFmpeg, cached on the runner: see release.yml for
      # the provenance and the checks it stands in for.
      - name: Restore prebuilt FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: bin
          key: ffmpeg-evermeet-9.0.2-macos
      - name: Install prebuilt FFmpeg for media tests
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -sSfL --retry 3 -o ffmpeg.zip "https://evermeet.cx/ffmpeg/ffmpeg-9.0.2.zip"
          curl -sSfL --retry 3 -o ffprobe.zip "https://evermeet.cx/ffmpeg/ffprobe-9.0.2.zip"
          shasum -a 256 -c - <<'SUMS'
          4acc0be580f9b2788029eb7bd4d645ff87968911b0a62aeeb3940d42d54558d5  ffmpeg.zip
          24a9c968cd4da72d99c7245e914b921815835eb6dff01d99868031aebaf1d439  ffprobe.zip
          SUMS
          unzip -q ffmpeg.zip
          unzip -q ffprobe.zip
          mkdir bin
          mv ffmpeg ffprobe bin/
      - name: Add FFmpeg to PATH
        run: echo "$(pwd)/bin" >> "$GITHUB_PATH"
      - run: go test ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /dev/stderr | (! grep .)
