<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEDB0"/>
      <stop offset="0.55" stop-color="#FFC768"/>
      <stop offset="1" stop-color="#FF8E3D"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F07A36"/>
      <stop offset="1" stop-color="#D95B22"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A3A1D"/>
      <stop offset="1" stop-color="#471F10"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- sky -->
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- sun -->
    <circle cx="342" cy="168" r="74" fill="#FFFDF2"/>

    <!-- far hill -->
    <path d="M-8 348 C 90 300 168 262 240 264 C 330 267 408 330 520 358 L520 520 L-8 520 Z"
          fill="url(#hillFar)"/>

    <!-- near hill -->
    <path d="M-8 520 L-8 424 C 108 378 196 334 304 352 C 402 368 470 424 520 452 L520 520 Z"
          fill="url(#hillNear)"/>
  </g>
</svg>
